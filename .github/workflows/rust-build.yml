name: Build GDExtension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            artifact_dir: linux
            build_cmd: cargo build --release
            library: rust/target/release/libmusic_tagger.so

          - name: windows
            os: windows-latest
            artifact_dir: windows
            build_cmd: cargo build --release
            library: rust/target/release/music_tagger.dll

          - name: macos-intel
            os: macos-latest
            target: x86_64-apple-darwin
            artifact_dir: macos/x86_64
            build_cmd: cargo build --release --target x86_64-apple-darwin
            library: rust/target/x86_64-apple-darwin/release/libmusic_tagger.dylib

          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact_dir: macos/arm64
            build_cmd: cargo build --release --target aarch64-apple-darwin
            library: rust/target/aarch64-apple-darwin/release/libmusic_tagger.dylib

    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build
        shell: bash
        run: ${{ matrix.build_cmd }}

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p ../artifact/${{ matrix.artifact_dir }}
          cp ../${{ matrix.library }} ../artifact/${{ matrix.artifact_dir }}/

      - name: Upload partial artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: artifact/

  bundle:
    name: Bundle Libraries
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: music-tagger-libraries

      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-tagger-libraries
          path: music-tagger-libraries
