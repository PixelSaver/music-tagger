[package]
name = "music-tagger"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]


[dependencies]
godot = { git = "https://github.com/godot-rust/gdext", branch = "master" }
clap = { version = "4.6.1", features = ["derive"] }
env_logger = "0.11.11"
lofty = "0.24.0"
log = "0.4.33"
m3u8-rs = "6.0.0"
serde = { version = "1", features = ["derive"]}
serde_json = "1.0.150"
thiserror = "2.0.18"
walkdir = "2.5.0"
strsim = "0.11.1"
flume = "0.12.0"
bincode = { version = "1.3.3" }
